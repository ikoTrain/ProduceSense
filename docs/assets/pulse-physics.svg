<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img"><style>text{font-family:Arial,sans-serif;fill:#172633;stroke:none}.label{font-size:22px}.small{font-size:18px}path,rect,circle{stroke:#172633;stroke-width:2;fill:none} .blue{stroke:#245c80} </style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" style="fill:#172633;stroke:none"/></marker></defs><rect width="1100" height="470" fill="white" stroke="none"/><text x="36" y="42" class="label">2. Two electrodes: tissue and contact response</text><text x="55" y="125" class="small">Electrode A</text><text x="885" y="125" class="small">Electrode B</text><path d="M75 210 L180 210" /><rect x="180" y="160" width="210" height="100" fill="white"/><text x="201" y="197" class="label">Contact A</text><text x="200" y="230" class="small">metal–tissue</text><path d="M390 210 L470 210" /><circle cx="470" cy="210" r="5" style="fill:#172633;stroke:none"/><path d="M470 210 L470 145" /><path d="M470 145 L540 145" /><rect x="540" y="128" width="130" height="34" fill="white"/><path d="M670 145 L740 145" /><path d="M740 145 L740 210" /><text x="552" y="112" class="small">Reff</text><path d="M470 210 L470 285" /><path d="M470 285 L590 285" /><path d="M590 260 L590 310" /><path d="M610 260 L610 310" /><path d="M610 285 L740 285" /><path d="M740 285 L740 210" /><text x="628" y="326" class="small">Ceff</text><circle cx="740" cy="210" r="5" style="fill:#172633;stroke:none"/><path d="M740 210 L790 210" /><rect x="790" y="160" width="210" height="100" fill="white"/><text x="809" y="197" class="label">Contact B</text><text x="809" y="230" class="small">metal–tissue</text><path d="M1000 210 L1060 210" /><text x="440" y="370" class="small">Tissue: conduction and charge storage</text><text x="40" y="415" class="small">Reff: effective resistance; Ceff: effective capacitance. Contacts also have dynamic behavior.</text><text x="40" y="446" class="small">This is a physical model. No separate capacitor is installed.</text></svg>
