<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1200"><style>text{font-family:Arial,sans-serif;fill:#172633;stroke:none}rect{fill:white;stroke:#172633;stroke-width:2}path{fill:none;stroke:#172633;stroke-width:2}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" style="fill:#172633;stroke:none"/></marker></defs><rect width="1100" height="1200" style="fill:white;stroke:none"/><text x="550" y="35" font-size="25" text-anchor="middle">5. Model preparation and classification algorithm</text><text x="230" y="78" font-size="18" text-anchor="middle">MODEL PREPARATION</text><text x="755" y="78" font-size="18" text-anchor="middle">ON-DEVICE INFERENCE</text><rect x="45" y="110" width="370" height="78" rx="0"/><text x="230" y="136" font-size="20" text-anchor="middle">6 training specimens</text><text x="230" y="160" font-size="20" text-anchor="middle">2 placements per specimen</text><path d="M230 188 V220" marker-end="url(#a)"/><rect x="45" y="220" width="370" height="78" rx="0"/><text x="230" y="246" font-size="20" text-anchor="middle">Average each specimen</text><text x="230" y="270" font-size="20" text-anchor="middle">→ 6 training vectors</text><path d="M230 298 V330" marker-end="url(#a)"/><rect x="45" y="330" width="370" height="78" rx="0"/><text x="230" y="356" font-size="20" text-anchor="middle">Compute μ and σ</text><text x="230" y="380" font-size="20" text-anchor="middle">and three class centroids c</text><path d="M230 408 V440" marker-end="url(#a)"/><rect x="45" y="440" width="370" height="78" rx="0"/><text x="230" y="466" font-size="20" text-anchor="middle">Store coefficients</text><text x="230" y="490" font-size="20" text-anchor="middle">in firmware; freeze the model</text><rect x="550" y="105" width="410" height="55" rx="20"/><text x="755" y="131" font-size="20" text-anchor="middle">BOOT: select mode</text><path d="M755 160 V182" marker-end="url(#a)"/><rect x="550" y="182" width="410" height="80" rx="0"/><text x="755" y="208" font-size="20" text-anchor="middle">Fast: T = 5 s, N = 6</text><text x="755" y="232" font-size="20" text-anchor="middle">Slow: T = 30 s, N = 30</text><path d="M755 262 V284" marker-end="url(#a)"/><rect x="550" y="284" width="410" height="60" rx="0"/><text x="755" y="310" font-size="20" text-anchor="middle">Blue LED; wait T; k = 0</text><path d="M755 344 V370" marker-end="url(#a)"/><rect x="550" y="370" width="410" height="105" rx="0"/><text x="755" y="396" font-size="20" text-anchor="middle">Forward + reverse pulse</text><text x="755" y="420" font-size="20" text-anchor="middle">Sample at 1, 5, 20 ms</text><text x="755" y="444" font-size="20" text-anchor="middle">Sum mV readings; check raw codes</text><path d="M755 475 V497" marker-end="url(#a)"/><rect x="550" y="497" width="410" height="50" rx="0"/><text x="755" y="523" font-size="20" text-anchor="middle">k = k + 1</text><path d="M755 547 V570" marker-end="url(#a)"/><path d="M755 570 L895 610 L755 650 L615 610 Z"/><text x="755" y="605" font-size="18" text-anchor="middle">k = N?</text><path d="M895 610 H1035 V350 H755 V370" marker-end="url(#a)"/><text x="1008" y="593" font-size="18" text-anchor="middle">No</text><text x="1010" y="540" font-size="17" text-anchor="middle">400 ms</text><path d="M755 650 V680" marker-end="url(#a)"/><text x="780" y="670" font-size="18" text-anchor="middle">Yes</text><path d="M755 680 L930 730 L755 780 L580 730 Z"/><text x="755" y="725" font-size="18" text-anchor="middle">Any raw &lt; 20</text><text x="755" y="748" font-size="18" text-anchor="middle">or raw > 4075?</text><path d="M580 730 H440" marker-end="url(#a)"/><text x="480" y="715" font-size="18" text-anchor="middle">Yes</text><rect x="45" y="690" width="395" height="80" rx="20"/><text x="242.5" y="716" font-size="20" text-anchor="middle">Purple LED: INVALID</text><text x="242.5" y="740" font-size="20" text-anchor="middle">No class result is issued</text><path d="M755 780 V810" marker-end="url(#a)"/><text x="780" y="802" font-size="18" text-anchor="middle">No</text><rect x="550" y="810" width="410" height="60" rx="0"/><text x="755" y="836" font-size="20" text-anchor="middle">Mean features x = sums / N</text><path d="M755 870 V892" marker-end="url(#a)"/><rect x="550" y="892" width="410" height="60" rx="0"/><text x="755" y="918" font-size="20" text-anchor="middle">Standardize z = (x − μ) / σ</text><path d="M230 518 V560 H20 V922 H550" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="290" y="905" font-size="17" text-anchor="middle">Stored coefficients</text><path d="M755 952 V974" marker-end="url(#a)"/><rect x="550" y="974" width="410" height="80" rx="0"/><text x="755" y="1000" font-size="20" text-anchor="middle">Compute D² for each centroid</text><text x="755" y="1024" font-size="20" text-anchor="middle">Select the class with min D²</text><path d="M755 1054 V1076" marker-end="url(#a)"/><rect x="500" y="1076" width="510" height="100" rx="20"/><text x="755" y="1102" font-size="20" text-anchor="middle">LED: apple / potato / cucumber</text><text x="755" y="1126" font-size="20" text-anchor="middle">red / yellow / green</text><text x="755" y="1150" font-size="20" text-anchor="middle">Wait for the next start</text></svg>
