<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img"><style>text{font-family:Arial,sans-serif;fill:#172633;stroke:none}.label{font-size:22px}.small{font-size:18px}path,rect,circle{stroke:#172633;stroke-width:2;fill:none} .blue{stroke:#245c80} </style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" style="fill:#172633;stroke:none"/></marker></defs><rect width="1100" height="590" fill="white" stroke="none"/><text x="36" y="42" class="label">3. Measurement circuit wiring</text><rect x="45" y="105" width="230" height="330" fill="white"/><text x="70" y="145" class="label">ESP32-S3</text><text x="70" y="210" class="label">GPIO5 · output</text><text x="70" y="300" class="label">GPIO4 · ADC</text><text x="70" y="390" class="label">GPIO6 · output</text><path d="M275 205 L380 205" /><rect x="380" y="188" width="130" height="34" fill="white"/><path d="M510 205 L630 205" /><text x="385" y="165" class="label">R = 10 kΩ</text><circle cx="630" cy="205" r="5" style="fill:#172633;stroke:none"/><text x="600" y="170" class="small">UA</text><path d="M275 295 L630 295" /><path d="M630 295 L630 205" /><path d="M630 205 L820 205" /><path d="M820 205 L820 240" /><rect x="735" y="250" width="270" height="100" rx="25" fill="#f3f5f6"/><path d="M820 240 L820 278" /><path d="M800 278 L840 278" /><text x="850" y="280" class="small">A</text><text x="845" y="316" class="small">Tissue</text><path d="M800 330 L840 330" /><path d="M820 330 L820 385" /><text x="850" y="345" class="small">B</text><path d="M275 385 L820 385" /><text x="700" y="125" class="small">Two separate electrodes</text><text x="45" y="475" class="small">Forward: GPIO5 = HIGH, GPIO6 = LOW; conventional current A → B.</text><text x="45" y="509" class="small">Reverse: GPIO5 = LOW, GPIO6 = HIGH; conventional current B → A.</text><text x="45" y="543" class="small">Idle: both outputs LOW. The ADC always measures UA relative to board GND.</text><text x="45" y="577" class="small">HIGH ≈ 3.3 V; LOW ≈ 0 V. Electrode B connects to GPIO6, not permanently to GND.</text></svg>
